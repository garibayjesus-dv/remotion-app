name: Generar Reel con IA

on:
  workflow_dispatch:
    inputs:
      tema:
        description: '🎬 Tema del Reel (ej: 5 cosas que encontraron en la Fosa de las Marianas)'
        required: true
        default: 'El misterio del barco fantasma Mary Celeste'
      formato:
        description: '🎭 Formato y Estilo Visual'
        required: true
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'documental'
          - 'top_datos'
          - 'ciencia'
          - 'terror'
          - 'noticia'
          - 'espiritual'
          - 'infantil'
      motor_voz:
        description: '🎙️ Motor de Voz Principal'
        required: true
        type: choice
        default: 'fish_drama3'
        options:
          - 'fish_drama3'
          - 'azure_multivoz'
      id_voz_fish:
        description: '🔑 ID o URL de voz de Fish Audio opcional (vacío = usar tu voz por defecto)'
        required: false
        default: ''
      guion_propio:
        description: '📜 Guion propio opcional (pega aquí tu guion de los Prompts Expertos o déjalo vacío)'
        required: false
        default: ''

permissions:
  contents: read
  models: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 con caché
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: my-video/package-lock.json

      - name: Instalar dependencias del proyecto
        run: |
          cd my-video
          npm ci --prefer-offline

      - name: Generar guion, imágenes, voz, renderizar y enviar a Telegram
        working-directory: ./my-video
        env:
          TEMA_VIDEO: ${{ github.event.inputs.tema }}
          FORMATO_VIDEO: ${{ github.event.inputs.formato }}
          MOTOR_VOZ: ${{ github.event.inputs.motor_voz }}
          FISH_VOICE_OVERRIDE: ${{ github.event.inputs.id_voz_fish }}
          GUION_PROPIO: ${{ github.event.inputs.guion_propio }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_FOUNDRY_KEY: ${{ secrets.AZURE_FOUNDRY_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
        run: node crear-video-ia.mjs

      - name: Subir video y portada renderizados como respaldo en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: reel-generado
          path: |
            my-video/out/reel_azure_premium.mp4
            my-video/out/portada_reel.jpg
          retention-days: 7