name: Generar Reel con IA

on:
  workflow_dispatch:
    inputs:
      tema:
        description: '🎬 Tema del Reel (ej: El incidente del Paso Diátlov)'
        required: true
        default: 'El misterio del barco fantasma Mary Celeste'

permissions:
  contents: read
  models: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con caché
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-video/package-lock.json

      - name: Instalar dependencias del proyecto
        run: |
          cd my-video
          npm ci --prefer-offline

      - name: Generar guion, imágenes, voz y renderizar video
        working-directory: ./my-video
        env:
          TEMA_VIDEO: ${{ github.event.inputs.tema }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: node crear-video-ia.mjs

      - name: Subir video renderizado
        uses: actions/upload-artifact@v4
        with:
          name: reel-generado
          path: my-video/out/reel_azure_premium.mp4
          retention-days: 7