name: Generar Reel con IA

on:
  workflow_dispatch:
    inputs:
      tema:
        description: '🎬 Tema del Reel (ej: El incidente del Paso Diátlov)'
        required: true
        default: 'El misterio del barco fantasma Mary Celeste'

permissions:
  contents: read
  models: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js con caché
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-video/package-lock.json

      - name: Instalar dependencias del proyecto
        run: |
          cd my-video
          npm ci --prefer-offline

      - name: Generar guion, imágenes, voz y renderizar video
        working-directory: ./my-video
        env:
          TEMA_VIDEO: ${{ github.event.inputs.tema }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_FOUNDRY_KEY: ${{ secrets.AZURE_FOUNDRY_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
        run: node crear-video-ia.mjs

      - name: 📲 Enviar Reel terminado a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEMA_VIDEO: ${{ github.event.inputs.tema }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F video=@"my-video/out/reel_azure_premium.mp4" \
            -F supports_streaming="true" \
            -F caption="🎬 ¡Reel listo para publicar!%0A📌 Tema: ${TEMA_VIDEO}"

      - name: Subir video renderizado como respaldo en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: reel-generado
          path: my-video/out/reel_azure_premium.mp4
          retention-days: 7