name: Generar Reel con IA

on:
  workflow_dispatch:

jobs:
  render:
    name: Compilar Video Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar FFmpeg y Edge-TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install edge-tts

      - name: Instalar dependencias de Remotion
        run: npm ci || npm install

      - name: Generar imágenes, voz y renderizar video
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node crear-video-ia.mjs

      - name: Subir video renderizado
        uses: actions/upload-artifact@v4
        with:
          name: reel-punto-nemo
          path: out/*.mp4
          retention-days: 7